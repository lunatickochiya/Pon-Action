name: Build 25.12 Pon Airoha

# Fix for broken build: https://github.com/softprops/action-gh-release/issues/236
permissions:
  contents: write
  actions: write

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      config_repo:
        description: 'Use json config repo true(1) or false(0) See ReadME'
        required: true
        default: '{"Cache": "1", "CacheSave": "false", "UPLOAD_RELEASE": "1", "ALLKMOD": "1"}'

      MACH:
        description: 'Choose machine'
        required: true
        default: 'hg5585f-cu'
        type: choice
        options:
        - 'hg5585f-cu'
        - 'hg5585f-cu-lite'
        - 'hg5585f-ct'
        - '040g-md'

      SFE_BUILDIN:
        description: 'Build sfe '
        default: 'true'
        type: choice
        options:
        - 'true'
        - 'false'

      IPTV_PLUGIN:
        description: 'Airoha IPTV plugin（默认 luci-app-iptv）'
        required: true
        default: 'luci-app-iptv'
        type: choice
        options:
        - 'luci-app-iptv'
        - 'luci-app-iptv-cmcc'

      patch_repo:
        description: 'Use json patch repo true(1) or false(0) See ReadME'
        required: true
        default: '{"Branch": "openwrt-25.12-pon", "TRY_BBR_V3": "1", "BCM_FULLCONE": "1", "Firewall_Allow_WAN": "0", "ADD_IB": "1", "ADD_SDK": "1", "ADD_eBPF": "0", "DOCKER_BUILDIN": "0"}'

      SETIP:
        description: 'Set LAN IP address'
        default: '192.168.7.1'
        required: false

      packages:
        description: 'OpenWrt packages（example: luci-app-example,luci-app-helloworld）'
        required: true
        default: 'luci-app-mwan-switch'
      packages_mod:
        description: 'The Above packages set to which'
        default: 'm'
        type: choice
        options:
        - 'y'
        - 'm'
        - 'n'

env:
  TZ: Asia/Shanghai
  OpenWrt_PATCH_FILE_DIR: openwrt-2512
  PON_REPO_TOKEN: ${{ secrets.MY_SECRET_TOKEN }}

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      machine: ${{ steps.set-matrix.outputs.machine }}
      allkmod: ${{ steps.switches.outputs.allkmod }}
      addsdk: ${{ steps.switches.outputs.addsdk }}
    env:
      Target_CFG_Machine: ${{ github.event.inputs.MACH || github.event.client_payload.MACH }}
    steps:
      - name: 检查
        uses: actions/checkout@main
      
      - name: 生成矩阵配置
        id: set-matrix
        run: bash "$GITHUB_WORKSPACE/core-2512.sh" resolve-build-matrix

      - name: 解析构建开关
        id: switches
        env:
          CONFIG_JSON_INPUT: ${{ github.event.inputs.config_repo || github.event.client_payload.config_repo }}
          PATCH_JSON_INPUT: ${{ github.event.inputs.patch_repo || github.event.client_payload.patch_repo }}
        run: |
          [ -n "$CONFIG_JSON_INPUT" ] || CONFIG_JSON_INPUT='{}'
          [ -n "$PATCH_JSON_INPUT" ] || PATCH_JSON_INPUT='{}'
          ALLKMOD=$(echo "$CONFIG_JSON_INPUT" | jq -r '.ALLKMOD // "0"')
          ADD_SDK=$(echo "$PATCH_JSON_INPUT" | jq -r '.ADD_SDK // "0"')
          echo "allkmod=$ALLKMOD" >> "$GITHUB_OUTPUT"
          echo "addsdk=$ADD_SDK" >> "$GITHUB_OUTPUT"
          echo "::notice ::ALLKMOD=$ALLKMOD ADD_SDK=$ADD_SDK（ALLKMOD=1 时全量 kmod 由独立 kmods 任务用 SDK 编译）"
 
  build:
    runs-on: Ubuntu-24.04
    # GitHub 单个 job 上限 6 小时；ALLKMOD 的全量 kmod 编译已拆到 kmods 任务
    timeout-minutes: 350
    needs: prepare
    strategy:
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    name: Build ${{ needs.prepare.outputs.machine }} ${{ matrix.target }} OpenWrt 25.12
    outputs:
      # 供 kmods 任务把产物追加到同一个 Release（两个 job 的 env.date 不同，不能各自计算 tag）
      tag: ${{ steps.tag.outputs.tag }}
    env:
      Matrix_Target: ${{ matrix.target }}
      Target_CFG_Machine: ${{ needs.prepare.outputs.machine }}

    steps:
    - name: 检查
      uses: actions/checkout@main

    - name: Print matrix from prepare
      run: |
         echo "::notice ::Matrix from prepare: ${{ needs.prepare.outputs.matrix }}"

    - name: 检查服务器配置
      run: |
        echo -e "------------------------------- CPU信息 -------------------------------\n"
        echo "CPU物理数量:$(cat /proc/cpuinfo| grep "physical id"| sort| uniq| wc -l)"
        echo -e "CPU核心及版本信息: $(cat /proc/cpuinfo | grep name | cut -f2 -d: | uniq -c) \n"
        echo -e "------------------------------- 内存信息 -------------------------------\n"
        echo "已安装内存详细信息: "
        sudo lshw -short -C memory | grep GiB
        echo -e "\n"
        echo -e "------------------------------- 磁盘信息 -------------------------------\n"
        echo -e "磁盘数量: $(ls /dev/sd* | grep -v [1-9] | wc -l) \n"
        echo "------------------------------- 磁盘详情 -------------------------------\n"
        df -Th

    - name: 释放Ubuntu磁盘空间
      uses: endersonmenezes/free-disk-space@v2
      with:
        remove_android: true
        remove_dotnet: true
        remove_haskell: true
        remove_tool_cache: true
        remove_swap: true
        remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
        remove_packages_one_command: true
        remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/share/glade* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell"
        testing: false

    - name: 初始化环境
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        chmod +x gen-sha256sum.sh add-test-packages.sh add-sfe-packages.sh core-2512.sh
        $GITHUB_WORKSPACE/core-2512.sh init-pkg-env

    - name: 设置GITHUB_ENV
      id: env
      env:
        PATCH_JSON_INPUT: ${{ github.event.inputs.patch_repo || github.event.client_payload.patch_repo }}
        CONFIG_JSON_INPUT: ${{ github.event.inputs.config_repo || github.event.client_payload.config_repo }}
        IPTV_PLUGIN_INPUT: ${{ github.event.inputs.IPTV_PLUGIN || github.event.client_payload.IPTV_PLUGIN }}
      run: |
        echo ${{matrix.target}}
        $GITHUB_WORKSPACE/core-2512.sh init-gh-env

    - name: 克隆源代码
      working-directory: /workdir
      id: clone
      run: |
        df -hT $PWD
        git clone --single-branch --branch "$REPO_BRANCH" "$REPO_URL" openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt
        cd openwrt
        sed -i \
          -e 's|https://git.openwrt.org/feed/packages.git;openwrt-25.12|https://github.com/openwrt/packages.git;openwrt-25.12|' \
          -e 's|https://git.openwrt.org/project/luci.git;openwrt-25.12|https://github.com/openwrt/luci.git;openwrt-25.12|' \
          -e 's|https://git.openwrt.org/feed/routing.git;openwrt-25.12|https://github.com/openwrt/routing.git;openwrt-25.12|' \
          -e 's|https://git.openwrt.org/feed/telephony.git;openwrt-25.12|https://github.com/openwrt/telephony.git;openwrt-25.12|' \
          feeds.conf.default
        sed -i '$a src-git lunatic7 https://github.com/lunatickochiya/luna-action-packages.git' feeds.conf.default
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 增加磁盘空间
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        $GITHUB_WORKSPACE/core-2512.sh ln-openwrt

    - name: Patch 自定义
      id: patch
      run: |
        $GITHUB_WORKSPACE/core-2512.sh init-openwrt-patch
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 添加 SFE
      if: github.event.inputs.SFE_BUILDIN == 'true'
      id: sfe
      run: |
        $GITHUB_WORKSPACE/core-2512.sh add-openwrt-sfe-2512
        echo "status=success" >> $GITHUB_OUTPUT
        echo "SFE=_SFE" >> $GITHUB_ENV

    - name: 自定义安装包(优先于feeds)
      if: steps.clone.outputs.status == 'success'
      id: files
      env:
        SFE_INPUT_STATUS: ${{ github.event.inputs.SFE_BUILDIN }}
      run: |
        $GITHUB_WORKSPACE/core-2512.sh add-openwrt-files
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Set LAN IP
      if: github.event.inputs.SETIP != '' && github.event.inputs.SETIP != '192.168.10.1'
      run: |
        IPSET_VALUE="${{ github.event.inputs.SETIP }}"
        sed -i "s/192\.168\.10\.1/$IPSET_VALUE/g" openwrt/package/kochiya/autoset/files/def_uci/zzz-autoset*

    - name: 更新 & 安装 feeds
      if: steps.files.outputs.status == 'success'
      id: feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        (rm -rf feeds/packages/lang/golang && cp -r $GITHUB_WORKSPACE/$OpenWrt_PATCH_FILE_DIR/feeds-packages-replace/* feeds/packages/ && echo "Golang Replaced")
        rm -rf feeds/packages.index
        (cp -r $GITHUB_WORKSPACE/$OpenWrt_PATCH_FILE_DIR/feeds-replace/luci/* feeds/luci/ && echo "luci-lib-docker Re-add")
        rm -rf feeds/luci.index
        ./scripts/feeds update luci packages
        ./scripts/feeds install -a
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 自定义配置（修复feeds）
      if: steps.feeds.outputs.status == 'success'
      id: config
      env:
        INPUT_PKGS_CFG_STATUS: ${{ github.event.inputs.packages_mod }}
        INPUT_PKGS_CFG_FOO: ${{ github.event.inputs.packages }}
      run: |
        $GITHUB_WORKSPACE/core-2512.sh fix-openwrt-feeds
        cd openwrt
        rm -rf feeds/telephony.index
        ./scripts/feeds update telephony
        ./scripts/feeds install -a
        cd ../
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Run awk command
      if: steps.config.outputs.status == 'success'
      working-directory: ./openwrt
      run: |
        $GITHUB_WORKSPACE/core-2512.sh awk-openwrt-config

    - name: 打包openwrt源码(供kmods任务做SDK的base feed)
      if: env.ALLKMOD == '1' && steps.config.outputs.status == 'success'
      working-directory: /workdir
      run: |
        # 只需要上一步打过补丁的 package/，SDK 的其余部分（tools/target/kernel 等）用自己的
        # package/feeds 是 feeds install 生成的符号链接，不打包，由 kmods 任务重新生成
        tar -I 'zstd -T0 -3' -cf "$GITHUB_WORKSPACE/openwrt-src.tar.zst" \
          --exclude='./package/feeds' \
          -C openwrt ./package
        ls -lh "$GITHUB_WORKSPACE/openwrt-src.tar.zst"

    - name: 上传openwrt源码
      uses: actions/upload-artifact@main
      continue-on-error: true
      if: env.ALLKMOD == '1' && steps.config.outputs.status == 'success'
      with:
        name: ${{ env.Target_CFG_Machine }}-${{matrix.target}}-openwrt-src
        path: openwrt-src.tar.zst

    - name: 下载包文件
      if: steps.config.outputs.status == 'success'
      run: |
        cd openwrt
        make download -j$(nproc)
        find dl -size -1024c -exec rm -f {} \;

    - name: 缓存staging
      uses: HiGarfield/cachewrtbuild@main
      if: env.Cache == '1' && !cancelled()
      with:
        ccache: 'true'
        mixkey: ${{ matrix.target }}${{ env.eBPF }}${{ env.Branch }}
        prefix: ${{ github.workspace }}/openwrt
        skip_saving: ${{ env.CacheSave }}

    - name: 编译固件
      id: compile
      working-directory: ./openwrt
      run: |
        echo -e "$(($(nproc)+1)) thread compile"
        make -j$(($(nproc)+1)) || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 检查空间使用情况
      if: (!cancelled())
      run: df -hT

    - name: 上传bin目录
      uses: actions/upload-artifact@main
      continue-on-error: true
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: ${{ env.date3 }}_${{matrix.target}}
        path: |
          openwrt/bin/

    - name: 打包SDK（供kmods任务）
      if: steps.compile.outputs.status == 'success' && env.ALLKMOD == '1'
      run: |
        cp -f openwrt/bin/targets/*/*/*sdk*.tar.zst ./openwrt-sdk.tar.zst
        ls -lh openwrt-sdk.tar.zst

    - name: 上传SDK（供kmods任务）
      uses: actions/upload-artifact@main
      continue-on-error: true
      if: steps.compile.outputs.status == 'success' && env.ALLKMOD == '1'
      with:
        name: ${{ env.Target_CFG_Machine }}-${{matrix.target}}-sdk
        path: openwrt-sdk.tar.zst

    - name: 打包ipk成zip文件
      id: afb
      continue-on-error: true
      if: steps.compile.outputs.status == 'success' && !cancelled()
      run: |
        $GITHUB_WORKSPACE/$DIY_SH_AFB
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 整理文件
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && steps.afb.outputs.status == 'success' && !cancelled()
      run: |
        mkdir -p firmware ipks
        [ ${{ env.UPLOAD_RELEASE}} = 1 ] && cp -u -f openwrt/ipks.zip firmware
        cp -u -f openwrt/ipks.zip ipks
        # ALLKMOD=1：全量 kmod 由 kmods 任务用 SDK 编译后追加到同一个 Release，
        # 这里不再携带固件构建自动产生的少量 kernelipks，避免后续同名覆盖。
        if [ "${ALLKMOD}" != "1" ]; then
          [ ${{ env.UPLOAD_RELEASE}} = 1 ] && cp -u -f openwrt/kernelipks.zip firmware
          cp -u -f openwrt/kernelipks.zip ipks
        fi
        mv -f openwrt/bin/targets/*/*/{*combined*,*ext4*,*sdk*,*imagebuilder*,*buildinfo*,*manifest*,*json*,*sha256sums*} ./firmware/ 2>/dev/null || true
        [ $UPLOAD_SYSUPGRADE = true ] && mv -f openwrt/bin/targets/*/*/{*combined*,*sysupgrade*,*openwrt*,*initramfs*,*factory*} ./firmware/ 2>/dev/null || true
        cp openwrt/.config  ./firmware/${{matrix.target}}.config
        cp openwrt/build_dir/target-*/linux-*/linux-*/.config ./firmware/${{matrix.target}}_kernel.config
        cd firmware
        echo "v${{ env.date2 }}" > version.txt
        echo ${{matrix.target}} >> version.txt
        rm -rf sha256sums
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 上传firmware目录
      uses: actions/upload-artifact@main
      continue-on-error: true
      if: steps.organize.outputs.status == 'success' && env.UPLOAD_FIRMWARE == 'true'
      with:
        name: ${{ env.date3 }}_${{matrix.target}}_firmware_25.12-${{ env.Target_CFG_Machine }}-${{ github.event.inputs.SETIP }}${{ env.Kernel_Test }}${{ env.BCM_FULLCONE_NAME }}${{ env.SFE }}${{ env.TRY_BBR_V3_NAME }}${{ env.OPENSSL_3_5_NAME }}${{ env.DOCKER_NAME }}${{ env.WAN_NAME }}${{ env.MAC80211_616_NAME }}${{ env.eBPF }}_${{ env.Branch }}
        path: |
          firmware

    - name: 上传软件包目录
      uses: actions/upload-artifact@main
      continue-on-error: true
      if: steps.organize.outputs.status == 'success' && env.UPLOAD_IPK_DIR == 'true' && steps.afb.outputs.status == 'success'
      with:
        name: ${{ env.date3 }}_${{matrix.target}}_packages_25.12-${{ env.Target_CFG_Machine }}${{ env.Kernel_Test }}${{ env.BCM_FULLCONE_NAME }}${{ env.SFE }}${{ env.TRY_BBR_V3_NAME }}${{ env.OPENSSL_3_5_NAME }}${{ env.DOCKER_NAME }}${{ env.WAN_NAME }}${{ env.MAC80211_616_NAME }}${{ env.eBPF }}_${{ env.Branch }}
        path: |
          ipks

    - name: 上传固件cowtransfer
      id: cowtransfer
      if: steps.organize.outputs.status == 'success' && env.UPLOAD_COWTRANSFER == 'true' && !cancelled()
      run: |
        curl -fsSL git.io/file-transfer | sh
        ./transfer cow --block 2621440 -s -p 64 --no-progress ${FIRMWARE} 2>&1 | tee cowtransfer.log
        echo "::warning file=cowtransfer.com::$(cat cowtransfer.log | grep https)"
        echo "url=$(cat cowtransfer.log | grep https | cut -f3 -d" ")" >> $GITHUB_OUTPUT

    - name: 上传固件WeTransfer
      id: wetransfer
      if: steps.organize.outputs.status == 'success' && env.UPLOAD_WETRANSFER == 'true' && !cancelled()
      run: |
        curl -fsSL git.io/file-transfer | sh
        ./transfer wet -s -p 16 --no-progress ${FIRMWARE} 2>&1 | tee wetransfer.log
        echo "::warning file=wetransfer.com::$(cat wetransfer.log | grep https)"
        echo "url=$(cat wetransfer.log | grep https | cut -f3 -d" ")" >> $GITHUB_OUTPUT

    - name: 生成发布标签
      id: tag
      if: steps.organize.outputs.status == 'success' && env.UPLOAD_RELEASE == '1' && !cancelled()
      run: |
        echo "tag=${{ env.date }}_${{matrix.target}}-${{ env.Target_CFG_Machine }}-openwrt-2512" >> "$GITHUB_OUTPUT"
        touch release.txt
        $GITHUB_WORKSPACE/gen-sha256sum.sh
        echo "# 当前固件IP地址："${{ github.event.inputs.SETIP }}" " >> release.txt
        [ ${{matrix.target}} = mt798x* ] && [ -e openwrt/target/linux/mediatek/filogic/base-files/lib/firmware/mediatek/nx30pro_eeprom.bin ] && echo "- eeprom 使用 H3C NX30 Pro 提取版本" >> release.txt
        [ "${{ env.Target_CFG_Machine }}" = rax3000m-emmc ] && echo "- 使用闪存频率: ($(grep -oP "max-frequency = <\K[0-9]*" openwrt/target/linux/mediatek/dts/mt7981b-cmcc-rax3000m-emmc-ubootmod.dts)) Hz" >> release.txt
        [ $UPLOAD_COWTRANSFER = true ] && echo "🔗 [Cowtransfer](${{ steps.cowtransfer.outputs.url }})" >> release.txt
        [ $UPLOAD_WETRANSFER = true ] && echo "🔗 [WeTransfer](${{ steps.wetransfer.outputs.url }})" >> release.txt
        echo "🔗 ${{ env.BCM_FULLCONE_NAME }}${{ env.SFE }}${{ env.TRY_BBR_V3_NAME }}${{ env.OPENSSL_3_5_NAME }}" >> release.txt
        if [[ "${{ matrix.target }}" == airoha-* ]]; then
          echo "- IPTV 插件: ${{ env.IPTV_PLUGIN }}" >> release.txt
        fi
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 上传固件发布
      uses: softprops/action-gh-release@v2
      if: steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        files: "${{ env.FIRMWARE }}/*"
        name: ${{ env.date }} ${{matrix.target}}-${{ env.Target_CFG_Machine }}-openwrt-2512
        tag_name: ${{ steps.tag.outputs.tag }}
        body_path: release.txt

    - name: 删除工作流
      uses: Mattraks/delete-workflow-runs@main
      continue-on-error: true
      with:
        retain_days: 10
        keep_minimum_runs: 20

    - name: 删除旧版本
      uses: dev-drprasad/delete-older-releases@master
      if: env.UPLOAD_RELEASE == '1' && !cancelled()
      continue-on-error: true
      with:
        keep_latest: 99
        delete_tags: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  kmods:
    runs-on: Ubuntu-24.04
    # GitHub 单个 job 上限 6 小时；SDK 已带工具链与内核，这里只编译全量 kmod
    timeout-minutes: 350
    needs: [prepare, build]
    if: needs.prepare.outputs.allkmod == '1'
    strategy:
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    name: Build ${{ needs.prepare.outputs.machine }} ${{ matrix.target }} Kmods(SDK) OpenWrt 25.12
    env:
      Matrix_Target: ${{ matrix.target }}
      Target_CFG_Machine: ${{ needs.prepare.outputs.machine }}

    steps:
    - name: 检查
      uses: actions/checkout@main

    - name: 释放Ubuntu磁盘空间
      uses: endersonmenezes/free-disk-space@v2
      with:
        remove_android: true
        remove_dotnet: true
        remove_haskell: true
        remove_tool_cache: true
        remove_swap: true
        remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
        remove_packages_one_command: true
        remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/share/glade* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell"
        testing: false

    - name: 初始化环境
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        chmod +x gen-sha256sum.sh add-test-packages.sh add-sfe-packages.sh core-2512.sh
        $GITHUB_WORKSPACE/core-2512.sh init-pkg-env

    - name: 设置GITHUB_ENV
      id: env
      env:
        PATCH_JSON_INPUT: ${{ github.event.inputs.patch_repo || github.event.client_payload.patch_repo }}
        CONFIG_JSON_INPUT: ${{ github.event.inputs.config_repo || github.event.client_payload.config_repo }}
        IPTV_PLUGIN_INPUT: ${{ github.event.inputs.IPTV_PLUGIN || github.event.client_payload.IPTV_PLUGIN }}
      run: |
        echo ${{matrix.target}}
        $GITHUB_WORKSPACE/core-2512.sh init-gh-env

    - name: 下载SDK与源码
      uses: actions/download-artifact@main
      with:
        pattern: ${{ needs.prepare.outputs.machine }}-${{ matrix.target }}-*
        path: /workdir/in
        merge-multiple: true

    - name: 解压SDK与源码
      working-directory: /workdir
      run: |
        ls -la in
        mkdir -p sdk openwrt-src
        tar --zstd -xf in/openwrt-sdk.tar.zst -C sdk --strip-components=1
        tar --zstd -xf in/openwrt-src.tar.zst -C openwrt-src
        rm -rf in
        ln -sfn /workdir/sdk /workdir/openwrt
        ln -sfn /workdir/openwrt "$GITHUB_WORKSPACE/openwrt"
        ls sdk | head -20
        du -sh sdk openwrt-src

    - name: 增加磁盘空间
      run: |
        sudo mkdir -p -m 777 /mnt/openwrt
        mv /workdir/sdk/build_dir /mnt/openwrt/build_dir
        rm -rf /workdir/sdk/dl
        mkdir -p /mnt/openwrt/dl
        ln -sf /mnt/openwrt/build_dir /workdir/sdk/build_dir
        ln -sf /mnt/openwrt/dl /workdir/sdk/dl
        df -hT
        ls -l /workdir/sdk | grep '^l'

    - name: 配置SDK feeds（base改为上一步openwrt源码）
      working-directory: /workdir/sdk
      run: |
        SRC=/workdir/openwrt-src
        # SDK 生成时已清空 base 行（原地址带仓库凭证，见 core-2512.sh），
        # 这里把 base 指向本仓上一步打过补丁的 openwrt package/；兼容仍存在 base 行的旧 SDK。
        if grep -qE '^src-git[[:space:]]+--root=package[[:space:]]+base[[:space:]]' feeds.conf.default; then
          sed -i -E "s#^src-git[[:space:]]+--root=package[[:space:]]+base[[:space:]].*#src-link --root=package base ${SRC}#" feeds.conf.default
        else
          sed -i "1i src-link --root=package base ${SRC}" feeds.conf.default
        fi
        grep -q "^src-link --root=package base ${SRC}$" feeds.conf.default || { echo "::error ::SDK base feed 替换失败"; exit 1; }
        cat feeds.conf.default

    - name: 更新 & 安装 feeds
      working-directory: /workdir/sdk
      run: |
        ./scripts/feeds update -a
        # 与主构建保持一致：BCM_FULLCONE=1 时不应用 luci fullcone 的 Revert 补丁
        if [ "$BCM_FULLCONE" = "1" ]; then
          rm -f "$GITHUB_WORKSPACE/$OpenWrt_PATCH_FILE_DIR/feeds-luci-patch/0004-Revert-luci-app-firewall-add-fullcone.patch"
        fi
        # 给 SDK 的 feeds 打上与主构建一致的仓库补丁
        # （v4l2loopback/xtables-addons/dahdi/oslec 等 kmod 的 Linux 6.18 修复）
        "$GITHUB_WORKSPACE/core-2512.sh" patch-openwrt-feeds "$PWD"
        ./scripts/feeds install -a

    - name: 生成基础配置（只保留kmod）
      working-directory: /workdir/sdk
      run: |
        # SDK 自带 CONFIG_ALL/CONFIG_ALL_KMODS/CONFIG_ALL_NONSHARED=y，
        # 且 Config-build.in 会带上固件构建时选中的包；这里先全部关掉，
        # 后续只把 kmod 置 =m，避免在 SDK 里重编整套固件包。
        rm -f .config
        printf '# CONFIG_ALL is not set\n# CONFIG_ALL_KMODS is not set\n# CONFIG_ALL_NONSHARED is not set\n' > .config
        make defconfig
        sed -i -E '/^CONFIG_PACKAGE_kmod/!s/^CONFIG_PACKAGE_([^=]+)=[ym]$/# CONFIG_PACKAGE_\1 is not set/' .config
        make defconfig

    - name: 应用SFE的kmod排除列表调整
      if: github.event.inputs.SFE_BUILDIN == 'true'
      run: |
        $GITHUB_WORKSPACE/core-2512.sh add-openwrt-sfe-kmods

    - name: 添加kmod（全量=m）
      run: |
        $GITHUB_WORKSPACE/core-2512.sh add-openwrt-kmods

    - name: Run awk command
      working-directory: ./openwrt
      run: |
        $GITHUB_WORKSPACE/core-2512.sh awk-openwrt-config

    - name: 下载包文件
      working-directory: /workdir/sdk
      run: |
        make download -j$(nproc)
        find dl -size -1024c -exec rm -f {} \;

    - name: 编译kmods
      id: compile
      working-directory: /workdir/sdk
      run: |
        echo -e "$(($(nproc)+1)) thread compile"
        make -j$(($(nproc)+1)) || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 检查空间使用情况
      if: (!cancelled())
      run: df -hT

    - name: 打包kmods
      id: afb
      continue-on-error: true
      if: steps.compile.outputs.status == 'success' && !cancelled()
      working-directory: /workdir/sdk
      run: |
        mkdir -p kernelipks
        cp -u -f bin/targets/*/*/packages/* kernelipks/
        ls kernelipks | wc -l
        zip -qq -r kernelipks.zip kernelipks
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 上传kmods目录
      uses: actions/upload-artifact@main
      continue-on-error: true
      if: steps.afb.outputs.status == 'success' && !cancelled()
      with:
        name: ${{ env.date3 }}_${{matrix.target}}_kmods_25.12-${{ env.Target_CFG_Machine }}
        path: /workdir/sdk/kernelipks.zip

    - name: 上传kmods到Release
      if: steps.afb.outputs.status == 'success' && env.UPLOAD_RELEASE == '1' && needs.build.outputs.tag != '' && !cancelled()
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release upload "${{ needs.build.outputs.tag }}" /workdir/sdk/kernelipks.zip --clobber
